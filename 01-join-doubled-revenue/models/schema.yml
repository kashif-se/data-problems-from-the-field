version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["completed", "cancelled"]

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_payments
    columns:
      - name: payment_id
        tests: [unique, not_null]

  - name: fct_orders
    description: One row per completed order.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_total
        tests: [not_null]

  - name: fct_order_items
    description: One row per line on a completed order.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]

  - name: monthly_revenue
    columns:
      - name: order_month
        tests: [unique, not_null]
